<div class="viz-controls"><label class="form-label">Timer state<select class="form-select" id="st-state"><option value="off">Off</option><option value="active">Active · 24 minutes remaining</option></select></label><label class="form-label">Desktop size<select class="form-select" id="st-size"><option>1280 × 720</option><option>1920 × 1080</option><option>2560 × 1440</option><option>3840 × 2160</option></select></label></div>
<div id="sleep-comp"><div class="st-frame"><section class="st-screen" aria-label="Timer picker in illustrative player context">
<div class="st-picture"><div class="st-hills"></div></div>
<div class="st-osd"><div class="st-identity"><span class="st-channel">12 · Evening television</span><h2>Harbor lights</h2><span>S1 E3 · The northern breakwater</span></div><div class="st-controls"><span class="st-context">Subtitles · Off</span><span class="st-context">Audio · English</span><div class="st-anchor"><button id="st-trigger" aria-label="Stop playback after…" aria-expanded="true" aria-controls="st-picker"><i data-lucide="moon" aria-hidden="true"></i><span id="st-label">Timer</span></button><section id="st-picker" aria-labelledby="st-title"><h3 id="st-title">Stop playback after…</h3><p id="st-remaining" hidden>Stops in 24 min</p><div id="st-choices"></div></section></div><span class="st-context">Menu</span><span class="st-context">Fullscreen</span></div><div class="st-time"><span>14:00 / 30:00</span><span>Up next · 8:30 PM · The quiet station</span></div><div class="st-progress"><span></span></div></div>
</section></div></div>
<style>
#sleep-comp{margin-top:12px;color-scheme:dark;color:#f3e8d2}
#sleep-comp *{box-sizing:border-box}
#sleep-comp .st-frame{overflow:hidden;background:#090806}
#sleep-comp .st-screen{position:relative;width:1280px;height:720px;transform-origin:top left;overflow:hidden;font:14px/1.4 Arial,sans-serif}
#sleep-comp .st-picture{position:absolute;inset:0;background:linear-gradient(#718d96,#bbc6bf 65%,#54747a)}
#sleep-comp .st-hills{position:absolute;inset:10% -5% 0;background:#36565b;clip-path:polygon(0 70%,18% 30%,34% 52%,55% 4%,73% 48%,90% 28%,100% 54%,100% 100%,0 100%)}
#sleep-comp .st-osd{position:absolute;bottom:0;left:0;right:0;padding:40px 40px 24px;isolation:isolate}
#sleep-comp .st-osd::before{content:"";position:absolute;inset:-95px 0 0;z-index:-1;background:linear-gradient(transparent,#09080699 35%,#090806df)}
#sleep-comp .st-channel{color:#d2c5ad;font-size:13px}
#sleep-comp h2{font-size:30px;font-weight:500;margin:4px 0}
#sleep-comp .st-identity>span:last-child{color:#d2c5ad}
#sleep-comp .st-controls{display:flex;justify-content:flex-end;align-items:center;gap:22px;margin:16px 0 24px}
#sleep-comp .st-context{color:#d2c5ad;font-size:13px}
#sleep-comp .st-anchor{position:relative;width:164px}
#sleep-comp button{font:inherit;color:inherit;background:transparent;border:0;cursor:pointer}
#sleep-comp button:focus-visible{outline:2px solid #f0d39a;outline-offset:-2px}
#sleep-comp #st-trigger{width:100%;display:flex;align-items:center;gap:10px;min-height:40px;padding:8px 12px;border-radius:4px;background:#f3e8d20b}
#sleep-comp #st-trigger svg{width:18px;height:18px;flex-shrink:0}
#sleep-comp #st-picker{position:absolute;bottom:calc(100% + 12px);right:0;width:236px;background:#12100dec;border:1px solid #c7b99f38;border-radius:8px;padding:16px 8px 8px;box-shadow:0 8px 24px #09080633}
#sleep-comp h3{font-size:15px;font-weight:500;margin:0 12px 12px}
#sleep-comp #st-remaining{font-size:12px;color:#d2c5ad;margin:-4px 12px 12px}
#sleep-comp .st-choice{display:flex;align-items:center;justify-content:space-between;text-align:left;padding:10px 12px;min-height:40px;width:100%;border-radius:4px}
#sleep-comp .st-choice:hover{background:#f3e8d211}
#sleep-comp .st-choice[aria-pressed="true"]{background:#cc9f5b16}
#sleep-comp .st-check{color:#f0d39a}
#sleep-comp .st-time{display:flex;justify-content:space-between;color:#d2c5ad;font-size:12px}
#sleep-comp .st-progress{height:3px;background:#f3e8d22b;margin-top:12px}
#sleep-comp .st-progress span{display:block;width:47%;height:100%;background:#cc9f5b}
#sleep-comp [hidden]{display:none!important}
#sleep-comp[data-large="true"] .st-osd{padding:60px 60px 36px}
#sleep-comp[data-large="true"] .st-osd::before{top:-142px}
#sleep-comp[data-large="true"] h2{font-size:45px}
#sleep-comp[data-large="true"] .st-identity{font-size:21px}
#sleep-comp[data-large="true"] .st-channel,#sleep-comp[data-large="true"] .st-context{font-size:19px}
#sleep-comp[data-large="true"] .st-controls{gap:33px;margin:24px 0 36px}
#sleep-comp[data-large="true"] .st-anchor{width:246px;font-size:21px}
#sleep-comp[data-large="true"] #st-trigger{min-height:60px;padding:12px 18px;gap:15px}
#sleep-comp[data-large="true"] #st-trigger svg{width:27px;height:27px}
#sleep-comp[data-large="true"] #st-picker{width:354px;padding:24px 12px 12px;bottom:calc(100% + 18px)}
#sleep-comp[data-large="true"] h3{font-size:22px;margin:0 18px 18px}
#sleep-comp[data-large="true"] #st-remaining{font-size:18px;margin:-6px 18px 18px}
#sleep-comp[data-large="true"] .st-choice{min-height:60px;padding:15px 18px}
#sleep-comp[data-large="true"] .st-time{font-size:18px}
</style>
<script>
(()=>{const root=document.getElementById('sleep-comp'),picker=document.getElementById('st-picker'),trigger=document.getElementById('st-trigger'),choices=document.getElementById('st-choices'),state=document.getElementById('st-state');let duration=0,remaining=0;
function setOpen(open,focus=false){picker.hidden=!open;trigger.setAttribute('aria-expanded',String(open));if(focus){if(open)choices.querySelector('[aria-pressed="true"]').focus();else trigger.focus()}}
function render(){document.getElementById('st-label').textContent=duration?'Stops in '+remaining+' min':'Timer';document.getElementById('st-remaining').hidden=!duration;document.getElementById('st-remaining').textContent='Stops in '+remaining+' min';choices.replaceChildren();[[0,'Off'],[30,'30 minutes'],[60,'1 hour'],[90,'90 minutes']].forEach(([n,label],index)=>{const button=document.createElement('button');button.className='st-choice';button.setAttribute('aria-pressed',String(duration===n));const text=document.createElement('span'),check=document.createElement('span');text.textContent=label;check.className='st-check';check.textContent=duration===n?'✓':'';check.setAttribute('aria-hidden','true');button.append(text,check);button.onclick=()=>{duration=n;remaining=n;state.value=n?'active':'off';render();setOpen(false,true)};button.onkeydown=e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();choices.children[(index+(e.key==='ArrowDown'?1:3))%4].focus()}};choices.append(button)})}
trigger.onclick=()=>setOpen(picker.hidden,true);state.onchange=()=>{duration=state.value==='active'?30:0;remaining=duration?24:0;render();setOpen(true)};root.addEventListener('click',e=>{if(!e.target.closest('.st-anchor')&&!picker.hidden){e.stopPropagation();setOpen(false,true)}});root.onkeydown=e=>{if(e.key==='Escape'||e.key==='Backspace'){e.preventDefault();setOpen(false,true)}else if(e.key.toLowerCase()==='s'){e.preventDefault();setOpen(true,true)}};
function scale(){const w=document.getElementById('st-size').selectedIndex===0?1280:1920,screen=root.querySelector('.st-screen');root.dataset.large=String(w===1920);screen.style.width=w+'px';screen.style.height=w*9/16+'px';screen.style.transform='scale('+root.clientWidth/w+')';root.querySelector('.st-frame').style.height=root.clientWidth*9/16+'px'}document.getElementById('st-size').onchange=scale;new ResizeObserver(scale).observe(root);render();scale()})();
</script>
