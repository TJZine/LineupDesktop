<script>
(()=>{const root=document.getElementById('setup-wide'),screen=root.querySelector('.wd-screen'),frame=root.querySelector('.wd-frame'),layout=document.getElementById('large-layout'),size=document.getElementById('large-size'),count=document.getElementById('large-count'),method=document.getElementById('lr-method'),search=document.getElementById('lr-search'),filter=document.getElementById('lr-filter'),confirm=document.getElementById('lr-confirm'),apply=document.getElementById('lr-apply'),list=root.querySelector('.lr-list');const families=['Playlists','Collections','Genres','Decades','Studios','Actors','Directors','Recently added'],themes=['Adventure','Mystery','Comedy','Drama','Animation','Documentaries','Science fiction','Classic cinema','Family favorites','Late-night discoveries'];let entries=[];
function resize(){const w=Number(size.value);root.dataset.large=String(w===1920);root.dataset.layout=layout.value;screen.style.width=w+'px';screen.style.height=w*9/16+'px';screen.style.transform='scale('+root.clientWidth/w+')';frame.style.height=root.clientWidth*9/16+'px';}
function make(i,kind){return {number:i+1,name:i%4===0?'The complete collection of classic science fiction, imaginative adventures and extraordinary journeys through space and time · Extended edition':i<10?'Custom collection '+(i+1):themes[(i-10)%themes.length]+' · Collection '+String(Math.floor((i-10)/themes.length)+1).padStart(2,'0'),source:i<10?'Custom':families[(i-10)%8],play:i%3===0?'In order':i%3===1?'Shuffle':'Mini-marathons',kind};}
function rows(reset){const scroll=list.scrollTop,q=search.value.trim().toLowerCase(),shown=entries.filter(r=>(filter.value==='All'||r.kind===filter.value)&&(r.name.toLowerCase().includes(q)||String(r.number).includes(q)));list.replaceChildren();const batch=document.createDocumentFragment();shown.forEach(r=>{const row=document.createElement('div');row.className='lr-row';row.setAttribute('role','listitem');[r.number,r.name,r.source,r.play,r.kind].forEach((value,i)=>{const cell=document.createElement('span');cell.textContent=value;if(i===0||i===2||i===3)cell.className='lr-meta';if(i===4){cell.className='lr-change';cell.dataset.kind=r.kind;}row.append(cell);});batch.append(row);});if(!shown.length){const empty=document.createElement('p');empty.textContent='No matching channels. Adjust your search or change filter.';batch.append(empty);}list.append(batch);document.getElementById('lr-count').textContent=shown.length+' of '+entries.length+' review entries';list.scrollTop=reset?0:scroll;}
function plan(){const final=Number(count.value),first=method.value==='first',current=first?0:document.getElementById('edge-check').value==='tiny'?11:final-30,replacing=method.value==='replace';entries=Array.from({length:final},(_,i)=>make(i,i<10?'Unchanged':replacing?'Added':i>=current?'Added':i<70?'Updated':'Unchanged'));if(replacing)entries.push(...Array.from({length:current-10},(_,i)=>make(i+10,'Removed')));if(first)entries=Array.from({length:final},(_,i)=>({...make(i+10,'Added'),number:i+1}));entries.sort((a,b)=>a.number-b.number||(a.kind==='Removed'?-1:1));root.dataset.reviewEntries=String(entries.length);const counts={Added:0,Updated:0,Unchanged:0,Removed:0};entries.forEach(r=>counts[r.kind]++);const total=root.querySelector('.lr-total');total.replaceChildren();const old=document.createElement('small');old.textContent=current+' current';const next=document.createElement('small');next.textContent=' final';total.append(old,document.createTextNode(' → '+final),next);const facts=root.querySelector('.lr-facts');facts.replaceChildren();Object.entries(counts).forEach(([key,n])=>{const fact=document.createElement('span');if(key==='Removed'&&n)fact.className='lr-removed';const value=document.createElement('strong');value.textContent=n;fact.append(value,document.createTextNode(key.toLowerCase()));facts.append(fact);});const totals=new Map(families.map(f=>[f,0]));entries.filter(r=>r.kind!=='Removed'&&r.source!=='Custom').forEach(r=>totals.set(r.source,totals.get(r.source)+1));root.querySelector('.lr-sources').textContent='Final generated channels: '+[...totals].map(([family,n])=>family+' '+n).join(' · ');root.querySelector('.lr-confirm').hidden=!replacing;document.getElementById('lr-confirm-copy').textContent='I understand that '+counts.Removed+' existing generated '+(counts.Removed===1?'channel will':'channels will')+' be removed.';root.querySelector('.lr-help').textContent=replacing?'Replace all generated channels with this selection. Custom channels will be kept.':'Update matching generated channels, add new ones, and keep the rest.';apply.textContent=replacing?'Replace generated channels':'Apply changes';apply.disabled=replacing&&!confirm.checked;rows(true);}
layout.onchange=resize;size.onchange=resize;count.onchange=()=>{confirm.checked=false;plan();};method.onchange=()=>{confirm.checked=false;plan();};search.oninput=()=>rows(true);filter.onchange=()=>rows(true);confirm.onchange=()=>apply.disabled=method.value==='replace'&&!confirm.checked;apply.onclick=()=>{const msg=document.getElementById('lr-message');msg.hidden=false;msg.textContent='Synthetic preview only — no changes applied.';};root.querySelector('.wd-back').onclick=()=>{const msg=document.getElementById('lr-message');msg.hidden=false;msg.textContent='Preview: return to Configure with choices preserved.';};new ResizeObserver(resize).observe(root);plan();resize();})();

<script>
(()=>{const root=document.getElementById('setup-wide'),filter=document.getElementById('lr-filter'),list=root.querySelector('.lr-list'),colors={Unchanged:'#6c6252',Updated:'#f0d39a',Added:'#cc9f5b',Removed:'#ff7768'};let previousSource='';
const all=document.createElement('button');all.className='rf-all';all.textContent='Show all';all.onclick=()=>{filter.value='All';filter.dispatchEvent(new Event('change'));};root.querySelector('.lr-toolbar').append(all);

function enhance(){const facts=root.querySelector('.lr-facts');let counts={};facts.querySelectorAll('span').forEach(f=>{const n=f.querySelector('strong');if(n){const raw=f.textContent.slice(n.textContent.length).trim();const key=raw.charAt(0).toUpperCase()+raw.slice(1);counts[key]=Number(n.textContent);}});if(Object.keys(counts).length){facts.replaceChildren();['Unchanged','Updated','Added','Removed'].forEach(kind=>{const button=document.createElement('button');button.dataset.kind=kind;button.setAttribute('aria-label','Show '+counts[kind]+' '+kind.toLowerCase()+' channels');const swatch=document.createElement('span');swatch.className='rf-swatch';swatch.style.background=counts[kind]===0?'var(--strong)':colors[kind];swatch.setAttribute('aria-hidden','true');button.append(swatch,document.createTextNode(counts[kind]+' '+kind.toLowerCase()));button.onclick=()=>{filter.value=kind;filter.dispatchEvent(new Event('change'));};facts.append(button);});bar.replaceChildren();const total=Object.values(counts).reduce((a,b)=>a+b,0);Object.entries(counts).sort(([a],[b])=>['Unchanged','Updated','Added','Removed'].indexOf(a)-['Unchanged','Updated','Added','Removed'].indexOf(b)).forEach(([kind,n])=>{if(!n)return;const segment=document.createElement('div');segment.className='rf-segment';segment.style.width=n/total*100+'%';segment.style.background=colors[kind];bar.append(segment);});bar.setAttribute('aria-label',Object.entries(counts).map(([kind,n])=>n+' '+kind.toLowerCase()).join(', ')+'. Includes outgoing channels; this is not the final lineup composition.');}
facts.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.kind===filter.value)));all.setAttribute('aria-pressed',String(filter.value==='All'));
const sources=root.querySelector('.lr-sources');if(sources.textContent.startsWith('Final generated channels:')){previousSource=sources.textContent;const entries=previousSource.replace('Final generated channels: ','').split(' · ');sources.replaceChildren();const heading=document.createElement('span');heading.textContent='Final generated channels';sources.append(heading);entries.forEach(entry=>{const match=entry.match(/^(.*) (\d+)$/);if(!match)return;const pair=document.createElement('span');pair.className='rf-source';const n=document.createElement('b');n.textContent=match[2];pair.append(document.createTextNode(match[1]),n);sources.append(pair);});}
list.querySelectorAll(':scope > .lr-row').forEach(row=>{if(row.lastElementChild.dataset.kind!=='Updated')return;const details=document.createElement('details');details.className='rf-detail';details.setAttribute('role','listitem');const summary=document.createElement('summary');summary.className='lr-row';while(row.firstChild)summary.append(row.firstChild);summary.lastElementChild.textContent='Updated';const disclosure=document.createElement('span');disclosure.className='rp-disclosure';disclosure.textContent='⌄';disclosure.setAttribute('aria-hidden','true');summary.lastElementChild.append(disclosure);const next=summary.children[3].textContent;const before=next==='Shuffle'?'In order':'Shuffle';const detail=document.createElement('div');detail.className='rf-before-after';detail.textContent='Playback: '+before+' → '+next;details.append(summary,detail);row.replaceWith(details);});}
['lr-filter','lr-method','large-count'].forEach(id=>document.getElementById(id).addEventListener('change',enhance));document.getElementById('lr-search').addEventListener('input',enhance);enhance();})();
</script>
<script>
(()=>{const root=document.getElementById('setup-wide'),state=document.getElementById('large-layout'),method=document.getElementById('lr-method'),filter=document.getElementById('lr-filter'),count=document.getElementById('large-count'),search=document.getElementById('lr-search');const firstOption=document.createElement('option');firstOption.value='first';firstOption.textContent='Create lineup';firstOption.hidden=true;method.append(firstOption);let savedMethod='merge';
function polish(){const first=state.value==='first';root.querySelector('h2').textContent=first?'Review your first lineup':'Review your lineup';root.querySelector('.wd-header p').textContent=first?'Check your channels before creating your lineup.':'Check what changes and what stays.';const label=root.querySelector('.rf-bar-label');if(label){label.textContent='Changes in this review'+(method.value==='replace'?' · Includes channels being removed':'');}const shown=root.querySelectorAll('.lr-list > .lr-row, .lr-list > .rf-detail').length;const total=Number(root.dataset.reviewEntries);document.getElementById('lr-count').textContent=filter.value==='All'?shown+' of '+total+' '+(first?'channels':'review entries'):filter.value+' · '+shown+' matching '+(shown===1?'channel':'channels');if(first){const headline=root.querySelector('.lr-total');headline.textContent=count.value+' channels ready to create';document.getElementById('lr-apply').textContent='Create lineup';root.querySelectorAll('.lr-change').forEach(c=>c.textContent='New');}}
state.addEventListener('change',()=>{if(state.value==='first'){savedMethod=method.value;method.value='first';}else method.value=savedMethod;filter.value='All';search.value='';method.dispatchEvent(new Event('change'));polish();});['lr-method','lr-filter','large-count'].forEach(id=>document.getElementById(id).addEventListener('change',polish));search.addEventListener('input',polish);polish();})();
</script>

<script>
(()=>{const root=document.getElementById('setup-wide'),check=document.getElementById('edge-check'),method=document.getElementById('lr-method'),layout=document.getElementById('large-layout'),size=document.getElementById('large-size');function change(){root.dataset.edge=check.value;layout.value='hybrid';layout.dispatchEvent(new Event('change'));method.value=check.value==='tiny'?'replace':'merge';method.dispatchEvent(new Event('change'));if(check.value==='text'){size.value='1280';size.dispatchEvent(new Event('change'));}}check.onchange=change;change();})();
</script>
