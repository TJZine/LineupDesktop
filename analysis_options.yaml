include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - unawaited_futures
    - discarded_futures
    - avoid_dynamic_calls
    - only_throw_errors
    - close_sinks
    - test_types_in_equals
    - prefer_final_locals
    - unnecessary_lambdas
    - use_super_parameters

# Deliberately rejected:
# - specify_nonobvious_local_variable_types: about 4,400 noise hits.
# - prefer_const_constructors: deliberately removed from flutter_lints.
# - avoid_catches_without_on_clauses: boundary catches are deliberate; C
#   handles the questionable ones.
# - cancel_subscriptions: false positives on fields.
