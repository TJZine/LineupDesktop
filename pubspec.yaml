name: lineup_desktop
description: Native desktop client for building and watching Plex-powered virtual TV channels.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  language_code: 0.7.1
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  xml: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/lineup-logo-mark.png
    - assets/branding/lineup-wordmark.png
  fonts:
    - family: Instrument Sans
      fonts:
        - asset: assets/fonts/instrumentsans/InstrumentSans[wdth,wght].ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter[opsz,wght].ttf
