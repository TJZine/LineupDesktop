name: lineup_desktop
description: Native desktop client for building and watching Plex-powered virtual TV channels.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.0.0
  http: ^1.6.0
  path_provider: ^2.1.6
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/lineup-logo-mark.png
    - assets/branding/lineup-wordmark.png
