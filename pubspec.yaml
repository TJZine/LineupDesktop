name: lineup_desktop
description: Native desktop client for building and watching Plex-powered virtual TV channels.
publish_to: "none"
version: 0.1.0+20

environment:
  sdk: ^3.13.0

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  language_code: 0.7.1
  material_ui: ^1.1.0
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  xml: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  objective_c:
    path: third_party/objective_c

hooks:
  user_defines:
    objective_c:
      macos_target_version: 12

flutter:
  uses-material-design: true
  assets:
    - assets/branding/lineup-logo-mark.png
    - assets/branding/lineup-wordmark.png
    - assets/fonts/instrumentsans/OFL.txt
    - assets/fonts/inter/OFL.txt
    - assets/fonts/arimo/LICENSE.txt
    - assets/fonts/subtitles/monoSans/
    - assets/fonts/subtitles/serif/
    - assets/fonts/subtitles/monoSerif/
    - assets/fonts/subtitles/casual/
    - assets/fonts/subtitles/cursive/
    - assets/fonts/subtitles/smallCaps/
    - assets/licenses/engine-notices.txt
    - assets/licenses/sources.json
    # BEGIN generated source materials
    - "LICENSE"
    - "analysis_options.yaml"
    - "assets/licenses/source-inventory.txt"
    - "docs/DEVELOPMENT.md"
    - "docs/licenses-and-rebuilding.md"
    - "pubspec.lock"
    - "pubspec.yaml"
    - "third_party/objective_c/LOCAL.patch"
    - "third_party/objective_c/VENDOR.md"
    - "third_party/objective_c/analysis_options.yaml"
    - "third_party/objective_c/hook/build.dart"
    - "third_party/objective_c/pubspec.yaml"
    - "tool/flutter_engine/0001-windows-direct-composition.patch"
    - "tool/flutter_engine/0002-desktop-accessibility.patch"
    - "tool/flutter_engine/0003-macos-apple-linker.patch"
    - "tool/flutter_engine/0004-windows-test-fixtures.patch"
    - "tool/flutter_engine/README.md"
    - "tool/flutter_engine/desktop-accessibility.json"
    - "tool/flutter_engine/desktop_accessibility.py"
    - "tool/flutter_version.json"
    - "tool/format.dart"
    - "tool/macos/build-mpv.sh"
    - "tool/macos/build_app.dart"
    - "tool/macos/collect-notices.py"
    - "tool/macos/ffmpeg-patches/0001-aarch64-do-not-build-GPL-licensed-AC-3-DSP-code.patch"
    - "tool/macos/ffmpeg-patches/0002-aarch64-do-not-build-GPL-licensed-CRC-assembly.patch"
    - "tool/macos/mpv-patches/0001-vulkan-mac-embed-into-host-CAMetalLayer-via-wid.patch"
    - "tool/macos/mpv-runtime.lock"
    - "tool/macos/native_assets.py"
    - "tool/macos/runtime-smoke-layer.m"
    - "tool/macos/runtime-smoke.c"
    - "tool/macos/source_materials.py"
    - "tool/windows/build-metadata.psd1"
    # END generated source materials
  fonts:
    - family: Arimo
      fonts:
        - asset: assets/fonts/arimo/Arimo-Regular.ttf
    - family: Instrument Sans
      fonts:
        - asset: assets/fonts/instrumentsans/InstrumentSans[wdth,wght].ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter[opsz,wght].ttf
