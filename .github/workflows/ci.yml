name: CI

on:
  push:
    branches: [main, flutter-mvp]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Dart
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
        env:
          TZ: America/New_York

  build-macos:
    name: Verify golden UI and build macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - id: golden
        env:
          # Golden baselines include localized schedule times.
          TZ: America/New_York
        run: |
          flutter test test/app/ui_acceptance_golden_test.dart
          flutter test test/app/guide_sparse_golden_test.dart
      - name: Upload golden failure images
        if: ${{ failure() && steps.golden.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: golden-ui-failures
          path: test/app/failures/
          if-no-files-found: error
          retention-days: 7
      - run: flutter build macos

  windows-release-policy:
    name: Verify Windows release policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate package scripts and pinned provenance inputs
        shell: pwsh
        run: ./tool/windows/verify-release-policy.ps1

  build-windows:
    name: Verify and build Windows player
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Verify portable UI on Windows
        run: >-
          flutter test
          test/app/ui_parity_test.dart
          test/guide/guide_view_test.dart
          test/playback/player_view_test.dart
      - name: Build with the pinned LGPL libmpv runtime
        shell: pwsh
        run: |
          $mpvRoot = Join-Path $env:RUNNER_TEMP 'lineup-mpv'
          & .\tool\windows\prepare-mpv.ps1 -Destination $mpvRoot
          $env:LINEUP_MPV_ROOT = $mpvRoot
          flutter build windows

  release-inputs:
    name: Detect Windows release inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      engine-required: ${{ steps.detect.outputs.engine-required }}
      package-required: ${{ steps.detect.outputs.package-required }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: metadata
        name: Read engine patch path
        shell: pwsh
        run: |
          $metadata = Import-PowerShellDataFile -LiteralPath ./tool/windows/build-metadata.psd1
          $path = $metadata.FlutterEnginePatchPath
          if ($path -notmatch '^[A-Za-z0-9._/-]+$' -or
              [IO.Path]::IsPathRooted($path) -or
              ($path -split '/') -contains '..') {
            throw 'FlutterEnginePatchPath must be a safe repository-relative path.'
          }
          "patch-path=$path" >> $env:GITHUB_OUTPUT
      - id: detect
        name: Detect engine and package changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          ENGINE_PATCH_PATH: ${{ steps.metadata.outputs.patch-path }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "engine-required=true" >> "$GITHUB_OUTPUT"
            echo "package-required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$PUSH_BEFORE"
            head="$CURRENT_SHA"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]] ||
             ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "engine-required=true" >> "$GITHUB_OUTPUT"
            echo "package-required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$base" "$head")"
          if grep -Eq '^(\.gitattributes|\.metadata|tool/windows/build-metadata\.psd1|tool/flutter_engine/apply\.ps1)$' <<<"$changed_files" ||
             grep -Fxq "$ENGINE_PATCH_PATH" <<<"$changed_files"; then
            engine_required=true
          else
            engine_required=false
          fi
          if [[ "$engine_required" == "true" ]] ||
             grep -Eq '^(\.github/workflows/ci\.yml|LICENSE|pubspec\.(lock|yaml)|docs/windows-runtime\.md|tool/flutter_engine/NOTICE|tool/windows/(build-inputs|build-release|package|prepare-mpv|verify-release-policy)\.ps1)$|^third_party/libmpv/' <<<"$changed_files"; then
            package_required=true
          else
            package_required=false
          fi
          echo "engine-required=$engine_required" >> "$GITHUB_OUTPUT"
          echo "package-required=$package_required" >> "$GITHUB_OUTPUT"

  build-windows-engine:
    name: Build patched Flutter engine and package
    needs: [release-inputs, windows-release-policy]
    if: >-
      needs.release-inputs.outputs.engine-required == 'true' ||
      needs.release-inputs.outputs.package-required == 'true'
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Validate exact Flutter and engine sources and build the patched engine
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $metadata = Import-PowerShellDataFile -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'tool/windows/build-metadata.psd1')
          $flutterSource = Join-Path $env:RUNNER_TEMP 'lineup-flutter-source'
          $depotTools = Join-Path $env:RUNNER_TEMP 'depot_tools'
          git clone --filter=blob:none https://github.com/flutter/flutter.git $flutterSource
          git -C $flutterSource checkout $metadata.FlutterFrameworkRevision
          if ((git -C $flutterSource rev-parse HEAD:engine/scripts/standard.gclient).Trim() -ne $metadata.FlutterStandardGclientBlob) {
            throw 'Pinned Flutter standard.gclient blob does not match.'
          }
          Copy-Item -LiteralPath (Join-Path $flutterSource 'engine\scripts\standard.gclient') -Destination (Join-Path $flutterSource '.gclient')
          git clone --depth 1 --no-checkout https://chromium.googlesource.com/chromium/tools/depot_tools.git $depotTools
          git -C $depotTools fetch --depth 1 origin $metadata.DepotToolsRevision
          git -C $depotTools checkout --detach $metadata.DepotToolsRevision
          if ((git -C $depotTools rev-parse HEAD).Trim() -ne $metadata.DepotToolsRevision) {
            throw 'depot_tools did not resolve to the pinned revision.'
          }
          $env:PATH = "$depotTools;$env:PATH"
          & (Join-Path $depotTools 'bootstrap\win_tools.bat')
          $env:DEPOT_TOOLS_UPDATE = '0'
          $env:DEPOT_TOOLS_WIN_TOOLCHAIN = '0'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $env:GYP_MSVS_OVERRIDE_PATH = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $env:WINDOWSSDKDIR = "${env:ProgramFiles(x86)}\Windows Kits\10"
          Set-Location $flutterSource
          gclient sync --no-history
          & "$env:GITHUB_WORKSPACE\tool\flutter_engine\apply.ps1" -FlutterRoot $flutterSource
          Set-Location (Join-Path $flutterSource 'engine\src')
          python .\flutter\tools\gn `
            --runtime-mode=release `
            --no-enable-unittests `
            --no-build-embedder-examples
          ninja -C out\host_release
      - name: Compile Lineup against the patched engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $mpvRoot = Join-Path $env:RUNNER_TEMP 'lineup-mpv'
          & .\tool\windows\prepare-mpv.ps1 -Destination $mpvRoot
          $env:LINEUP_MPV_ROOT = $mpvRoot
          $engineSource = Join-Path $env:RUNNER_TEMP 'lineup-flutter-source\engine\src'
          & .\tool\windows\build-release.ps1 -EngineSource $engineSource
          . .\tool\windows\build-inputs.ps1
          foreach ($coreSymlinks in @('true', 'false')) {
            $symlinkRepo = Join-Path $env:RUNNER_TEMP "lineup-tracked-symlink-$coreSymlinks"
            New-Item -ItemType Directory -Path $symlinkRepo -Force | Out-Null
            & git init --quiet $symlinkRepo
            & git -C $symlinkRepo config core.symlinks $coreSymlinks
            & git -C $symlinkRepo config user.email 'ci@example.invalid'
            & git -C $symlinkRepo config user.name 'Lineup CI'
            Set-Content -LiteralPath (Join-Path $symlinkRepo 'target.txt') -Value 'target'
            & git -C $symlinkRepo add target.txt
            $symlinkBlob = ('target.txt' | & git -C $symlinkRepo hash-object -w --stdin).Trim()
            & git -C $symlinkRepo update-index --add --cacheinfo "120000,$symlinkBlob,tracked-link"
            & git -C $symlinkRepo commit --quiet -m 'tracked symlink probe'
            try {
              Assert-NoTrackedSymlinks -Repository $symlinkRepo
              throw "Tracked symlink was accepted with core.symlinks=$coreSymlinks."
            } catch {
              if ($_.Exception.Message -notmatch 'tracked symbolic link') { throw }
            }
          }
          $buildJunctionTarget = Join-Path $env:RUNNER_TEMP 'lineup-build-junction-target'
          $buildJunctionPath = Join-Path $env:GITHUB_WORKSPACE 'build/windows/x64/runner/Release/data/reparse-probe'
          New-Item -ItemType Directory -Path $buildJunctionTarget -Force | Out-Null
          New-Item -ItemType Junction -Path $buildJunctionPath -Target $buildJunctionTarget | Out-Null
          try {
            try {
              & .\tool\windows\package.ps1 -Destination 'build/package/build-reparse-check'
              throw 'Build reparse point was accepted.'
            } catch {
              if ($_.Exception.Data['LineupPackageFailure'] -ne 'build-artifact-mismatch') { throw }
            }
          } finally {
            Remove-Item -LiteralPath $buildJunctionPath -Force
            Remove-Item -LiteralPath $buildJunctionTarget -Recurse -Force
          }
          $junctionTarget = Join-Path $env:RUNNER_TEMP 'lineup-package-junction-target'
          $junctionPath = Join-Path $env:GITHUB_WORKSPACE 'build/package/reparse-probe'
          New-Item -ItemType Directory -Path $junctionTarget -Force | Out-Null
          New-Item -ItemType Directory -Path (Split-Path -Parent $junctionPath) -Force | Out-Null
          New-Item -ItemType Junction -Path $junctionPath -Target $junctionTarget | Out-Null
          try {
            try {
              & .\tool\windows\package.ps1 -Destination 'build/package/reparse-probe/escaped'
              throw 'Package destination junction was accepted.'
            } catch {
              if ($_.Exception.Data['LineupPackageFailure'] -ne 'package-path-reparse') { throw }
            }
          } finally {
            Remove-Item -LiteralPath $junctionPath -Force
            Remove-Item -LiteralPath $junctionTarget -Recurse -Force
          }
          $dirtyProbe = Join-Path $env:GITHUB_WORKSPACE 'PACKAGE-DIRTY-PROBE'
          $dirtyDestination = 'build/package/dirty-source-check'
          Set-Content -LiteralPath $dirtyProbe -Value 'dirty'
          try {
            try {
              & .\tool\windows\package.ps1 -Destination $dirtyDestination
              throw 'Packaging unexpectedly accepted the source-state probe.'
            } catch {
              if ($_.Exception.Data['LineupPackageFailure'] -ne 'dirty-source') { throw }
            }
            if (Test-Path -LiteralPath $dirtyDestination) {
              throw 'Dirty-source packaging wrote package output before failing.'
            }
          } finally {
            Remove-Item -LiteralPath $dirtyProbe
          }
          $buildMarker = Join-Path $env:GITHUB_WORKSPACE 'build\windows\x64\runner\Release\LINEUP-BUILD-PROVENANCE.json'
          $markerBytes = [IO.File]::ReadAllBytes($buildMarker)
          foreach ($probe in @(
            @{
              Name = 'stale-source-marker'
              Property = 'sourceCommit'
              Value = '0000000000000000000000000000000000000000'
            },
            @{
              Name = 'engine-identity-marker'
              Property = 'flutterEngine'
              Value = '0000000000000000000000000000000000000000'
            }
          )) {
            try {
              $marker = Get-Content -Raw -LiteralPath $buildMarker | ConvertFrom-Json
              $marker.($probe.Property) = $probe.Value
              $marker | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $buildMarker -Encoding ascii
              try {
                & .\tool\windows\package.ps1 -Destination "build/package/$($probe.Name)"
                throw "Packaging unexpectedly accepted $($probe.Name)."
              } catch {
                if ($_.Exception.Data['LineupPackageFailure'] -ne 'build-provenance-mismatch') { throw }
              }
            } finally {
              [IO.File]::WriteAllBytes($buildMarker, $markerBytes)
            }
          }
          $engineArtifact = Join-Path $env:GITHUB_WORKSPACE 'build\windows\x64\runner\Release\flutter_windows.dll'
          $engineBytes = [IO.File]::ReadAllBytes($engineArtifact)
          try {
            Add-Content -LiteralPath $engineArtifact -Value 'tampered'
            try {
              & .\tool\windows\package.ps1 -Destination 'build/package/build-artifact-tamper-check'
              throw 'Packaging accepted a build artifact modified after provenance was recorded.'
            } catch {
              if ($_.Exception.Data['LineupPackageFailure'] -ne 'build-artifact-mismatch') { throw }
            }
          } finally {
            [IO.File]::WriteAllBytes($engineArtifact, $engineBytes)
          }
          $runtimeArtifact = Join-Path $env:GITHUB_WORKSPACE 'build\windows\x64\runner\Release\libmpv-2.dll'
          $runtimeProbe = Join-Path $env:RUNNER_TEMP 'lineup-libmpv-2.dll'
          try {
            Move-Item -LiteralPath $runtimeArtifact -Destination $runtimeProbe
            try {
              & .\tool\windows\package.ps1 -Destination 'build/package/missing-artifact-check'
              throw 'Packaging accepted a build with a required artifact missing.'
            } catch {
              if ($_.Exception.Data['LineupPackageFailure'] -ne 'build-artifact-mismatch') { throw }
            }
          } finally {
            if (Test-Path -LiteralPath $runtimeProbe) {
              Move-Item -LiteralPath $runtimeProbe -Destination $runtimeArtifact
            }
          }
          foreach ($licenseName in @(
            'mpv-LICENSE.LGPL',
            'FFmpeg-COPYING.LGPLv3',
            'FFmpeg-COPYING.GPLv3',
            'libplacebo-LICENSE'
          )) {
            $license = Join-Path $mpvRoot "licenses\$licenseName"
            $licenseBytes = [IO.File]::ReadAllBytes($license)
            try {
              Add-Content -LiteralPath $license -Value 'tampered'
              try {
                & .\tool\windows\package.ps1 -Destination 'build/package/provenance-tamper-check'
                throw "Packaging accepted a modified runtime license: $licenseName."
              } catch {
                if ($_.Exception.Data['LineupPackageFailure'] -ne 'runtime-license-mismatch') { throw }
              }
            } finally {
              [IO.File]::WriteAllBytes($license, $licenseBytes)
            }
          }
          & .\tool\windows\package.ps1
      - name: Upload portable Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LineupDesktop-windows-x64
          path: build/package/LineupDesktop-*-windows-x64.zip
          if-no-files-found: error
