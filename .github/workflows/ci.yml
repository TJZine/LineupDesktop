name: macOS tooltip Windows verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Dart
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: dart tool/check_toolchain.dart
      - run: flutter pub get
      - run: dart tool/format.dart --check
      - run: flutter analyze
      - run: flutter test
        env:
          TZ: America/New_York

  build-windows:
    name: Verify and build Windows player
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: dart tool/check_toolchain.dart
      - name: Verify portable UI on Windows
        run: >-
          flutter test
          test/app/ui_parity_test.dart
          test/app/desktop_navigation_test.dart
          test/app/channels_view_test.dart
          test/app/channel_studio_view_test.dart
          test/playback/player_coordinator_test.dart
          test/playback/method_channel_native_player_test.dart
          test/guide/guide_view_test.dart
          test/playback/player_view_test.dart
      - name: Build Windows and verify native contracts with the pinned LGPL libmpv runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $mpvRoot = Join-Path $env:RUNNER_TEMP 'lineup-mpv'
          & .\tool\windows\prepare-mpv.ps1 -Destination $mpvRoot
          $env:LINEUP_MPV_ROOT = $mpvRoot
          flutter build windows
          cmake --build .\build\windows\x64 --config Release --target track_list_encoder_test native_playback_state_test player_core_contract_test encodable_value_conversion_test display_dynamic_range_test display_guardian_test native_player_contract_test
          foreach ($nativeTest in @('track_list_encoder', 'native_playback_state', 'player_core_contract', 'encodable_value_conversion', 'display_dynamic_range')) {
            ctest --test-dir .\build\windows\x64 -C Release -R "^${nativeTest}$" --output-on-failure --no-tests=error --parallel 1 --timeout 30
          }
          ctest --test-dir .\build\windows\x64 -C Release -R '^display_guardian$' --output-on-failure --no-tests=error --parallel 1 --timeout 60
          $vulkanRoot = Join-Path $env:RUNNER_TEMP 'lineup-ci-vulkan'
          & .\tool\windows\prepare-ci-vulkan.ps1 -Destination $vulkanRoot
          # Fixture generators only: never copied into the application/package.
          # Versioned archive and publisher checksum: https://www.gyan.dev/ffmpeg/builds/
          $fixtureRoot = Join-Path $env:RUNNER_TEMP 'lineup-reference-tools'
          $fixtureArchive = Join-Path $env:RUNNER_TEMP 'lineup-reference-tools.zip'
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-9.0.2-essentials_build.zip' -OutFile $fixtureArchive -ConnectionTimeoutSeconds 30 -OperationTimeoutSeconds 180
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $fixtureArchive).Hash -ne '60F467265B1E312373DBCD92200C2618A74850F98D3D078E94296BB3FA2047BA') {
            throw 'SHA-256 mismatch for the pinned authenticated-reference fixture tools.'
          }
          Expand-Archive -LiteralPath $fixtureArchive -DestinationPath $fixtureRoot
          $fixtureBin = Join-Path $fixtureRoot 'ffmpeg-9.0.2-essentials_build/bin'
          foreach ($fixtureTool in @('ffmpeg.exe', 'ffprobe.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $fixtureBin $fixtureTool) -PathType Leaf)) {
              throw "Missing authenticated-reference fixture tool: $fixtureTool"
            }
          }
          cmake --build .\build\windows\x64 --config Release --target authenticated_reference_test
          $originalPath = $env:PATH
          $env:PATH = "$fixtureBin;$vulkanRoot;$originalPath"
          try {
            ctest --test-dir .\build\windows\x64 -C Release -R '^native_player_contract$' --output-on-failure --no-tests=error --parallel 1 --timeout 60
          } catch {
            $testFailure = $_
            try {
              & .\tool\windows\diagnose-native-startup.ps1 -Executable (Join-Path $env:GITHUB_WORKSPACE 'build/windows/x64/runner/Release/native_player_contract_test.exe')
            } catch {
              Write-Warning "Native startup diagnostics failed: $($_.Exception.Message)"
            }
            throw $testFailure
          } finally {
            $env:PATH = $originalPath
          }
          $env:PATH = "$fixtureBin;$vulkanRoot;$originalPath"
          try {
            ctest --test-dir .\build\windows\x64 -C Release -R '^authenticated_reference$' --output-on-failure --no-tests=error --parallel 1 --timeout 180
          } finally {
            $env:PATH = $originalPath
          }

